backend:
  name: github
  repo: nataligalagan88264-dotcom/geniq_website
  branch: main
  base_url: https://geniq-system.ru
  auth_endpoint: api/auth

local_backend: true
publish_mode: simple
locale: ru
media_folder: frontend/public/uploads
public_folder: /uploads
site_url: https://geniq-system.ru
display_url: https://geniq-system.ru
logo_url: /favicon.svg

collections:
  - name: settings
    label: Настройки сайта
    files:
      - name: site
        label: Общие настройки
        file: frontend/src/content/site.json
        format: json
        fields:
          - label: Бренд
            name: brand
            widget: object
            fields:
              - { label: Подпись возле логотипа, name: tagline_lines, widget: list }
          - label: Навигация
            name: navigation
            widget: list
            fields:
              - { label: Название, name: label, widget: string }
              - { label: Ссылка, name: to, widget: string }
          - { label: Текст кнопки в шапке, name: header_cta, widget: string }
          - label: Ссылки и медиа
            name: links
            widget: object
            fields:
              - { label: Ссылка на форму, name: form_url, widget: string }
              - { label: Telegram URL, name: telegram_url, widget: string }
              - { label: Telegram, name: telegram_handle, widget: string }
              - { label: Instagram URL, name: instagram_url, widget: string }
              - { label: Фото автора, name: author_photo, widget: image, required: false }
          - label: Анимации страниц
            name: media
            widget: object
            hint: Можно загрузить изображение или видео. Пустое поле оставляет текущую интерактивную SVG-анимацию.
            fields:
              - { label: О системе — корзина, name: about_animation, widget: file, required: false }
              - { label: Нейротипы — линза, name: neurotypes_animation, widget: file, required: false }
              - { label: Партнёрам — рукопожатие, name: partners_animation, widget: file, required: false }
          - label: Юридическая информация
            name: legal
            widget: object
            fields:
              - { label: ИП, name: ip, widget: string }
              - { label: ИНН, name: inn, widget: string }
              - { label: ОГРНИП, name: ogrnip, widget: string }
              - { label: Email, name: email, widget: string }
              - { label: Телефон, name: phone, widget: string }
              - { label: Сайт, name: site, widget: string }

      - name: home
        label: Главная страница
        file: frontend/src/content/home.json
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Надпись сверху, name: eyebrow, widget: string }
              - { label: Заголовок, name: title, widget: string }
              - { label: Цветная часть заголовка, name: accent_title, widget: string }
              - { label: Описание, name: description, widget: text }
              - { label: Текст кнопки, name: button, widget: string }
              - { label: Подпись возле кнопки, name: meta, widget: string }
              - { label: Видео головы, name: video, widget: file }
              - label: Разделы
                name: axes
                widget: list
                fields:
                  - { label: ID, name: id, widget: string }
                  - { label: Название, name: title, widget: string }
                  - { label: Подпись, name: subtitle, widget: string }
                  - { label: Иконка, name: icon, widget: select, options: [brain, sparkles, fingerprint, battery, eye] }
          - label: Услуги
            name: products
            widget: object
            fields:
              - { label: Надпись сверху, name: eyebrow, widget: string }
              - { label: Заголовок, name: title, widget: string }
              - { label: Цветная часть, name: accent_title, widget: string }
              - { label: Описание, name: description, widget: text }
              - { label: Примечание, name: note, widget: text }
              - { label: Метка рекомендуемой карточки, name: recommended_label, widget: string }
              - { label: Текст раскрытия, name: details_label, widget: string }
              - label: Подробности диагностики
                name: diagnostics
                widget: object
                fields:
                  - { label: Введение, name: intro, widget: text }
                  - label: Встречи
                    name: stages
                    widget: list
                    summary: "{{fields.title}}"
                    fields:
                      - { label: Заголовок, name: title, widget: string }
                      - { label: Что происходит, name: what, widget: text }
                      - { label: Что получает клиент, name: result, widget: text }
                      - { label: На что влияет, name: impact, widget: text }
              - label: Подробности индивидуальных треков
                name: tracks
                widget: object
                fields:
                  - { label: Введение, name: intro, widget: text }
                  - label: 5 этапов
                    name: stages
                    widget: list
                    summary: "{{fields.title}}"
                    fields:
                      - { label: Заголовок, name: title, widget: string }
                      - { label: Текст, name: text, widget: text }
                  - { label: Итог, name: result, widget: text }
                  - label: Направления
                    name: directions
                    widget: list
                    summary: "{{fields.title}}"
                    fields:
                      - { label: Название, name: title, widget: string }
                      - { label: Формат, name: meta, widget: text }
                      - { label: Абзацы, name: paragraphs, widget: list }
                      - { label: Что входит, name: bullets, widget: list }
                      - { label: Что забирает клиент, name: result, widget: text }
              - { label: Подпись под карточками, name: footer_note, widget: text }
              - label: Кому не подойдёт GENIQ
                name: limitations
                widget: object
                fields:
                  - { label: Надпись сверху, name: eyebrow, widget: string }
                  - { label: Заголовок, name: title, widget: string }
                  - { label: Цветная часть, name: accent_title, widget: string }
                  - { label: Описание, name: description, widget: text }
                  - label: Ограничения
                    name: items
                    widget: list
                    summary: "{{fields.title}}"
                    fields:
                      - { label: Заголовок, name: title, widget: string }
                      - { label: Текст, name: text, widget: text }
              - label: Карточки
                name: items
                widget: list
                summary: "{{fields.title}} — {{fields.price}}"
                fields:
                  - { label: ID, name: id, widget: string }
                  - { label: Иконка, name: icon, widget: select, options: [compass, sparkles, map] }
                  - { label: Надпись сверху, name: step, widget: string }
                  - { label: Запрос клиента, name: intent, widget: text }
                  - { label: Заголовок, name: title, widget: string }
                  - { label: Стоимость, name: price, widget: string }
                  - { label: Длительность, name: duration, widget: string }
                  - { label: Описание, name: description, widget: text }
                  - { label: Пункты, name: bullets, widget: list }
                  - { label: Кнопка, name: cta, widget: string }
                  - { label: Рекомендуемая, name: featured, widget: boolean, default: false }

      - name: home_sections
        label: Главная — смысловые блоки
        file: frontend/src/content/home-sections.json
        format: json
        fields:
          - label: История про шкаф
            name: wardrobe
            widget: object
            fields:
              - { label: Заголовок, name: title, widget: string }
              - label: Абзацы
                name: paragraphs
                widget: list
                fields:
                  - { label: Текст до акцента, name: before, widget: text, required: false }
                  - { label: Акцент, name: accent, widget: string, required: false }
                  - { label: Текст после акцента, name: after, widget: text, required: false }
              - label: Карточки
                name: cards
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: ID, name: id, widget: string }
                  - { label: Иконка, name: icon, widget: select, options: [school, university, family] }
                  - { label: Заголовок, name: title, widget: string }
                  - { label: Текст, name: text, widget: text }
                  - { label: Цвет, name: accent, widget: color }
              - label: Вывод
                name: conclusion
                widget: object
                fields:
                  - { label: До акцента, name: before, widget: text }
                  - { label: Акцент, name: accent, widget: string }
                  - { label: После акцента, name: after, widget: text, required: false }
              - { label: Заголовок фактов, name: stats_title, widget: string }
              - label: Факты
                name: stats
                widget: list
                fields:
                  - { label: ID, name: id, widget: string }
                  - { label: До акцента, name: before, widget: text }
                  - { label: Акцент, name: highlight, widget: string }
                  - { label: После акцента, name: after, widget: text, required: false }
          - label: Переход к системе
            name: bridge
            widget: object
            fields:
              - { label: Заголовок, name: title, widget: string }
              - { label: Цветная часть заголовка, name: accent_title, widget: string }
              - { label: Текст до первого акцента, name: text_before, widget: text }
              - { label: Первый акцент, name: text_accent, widget: string }
              - { label: Средняя часть, name: text_middle, widget: text }
              - { label: Второй акцент, name: text_second_accent, widget: string }
              - { label: Текст после акцента, name: text_after, widget: text }
          - label: Где применяется GENIQ
            name: applications
            widget: object
            fields:
              - { label: Надпись сверху, name: eyebrow, widget: string }
              - { label: Заголовок, name: title, widget: string }
              - { label: Цветная часть, name: accent_title, widget: string }
              - label: Направления
                name: items
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: ID, name: id, widget: string }
                  - { label: Иконка, name: icon, widget: select, options: [eye, box, arrow, battery, target, sparkles] }
                  - { label: Заголовок, name: title, widget: string }
                  - { label: Текст, name: text, widget: text }
          - label: Переход к нейротипам
            name: final_bridge
            widget: object
            fields:
              - { label: До акцента, name: before, widget: text }
              - { label: Акцент, name: accent, widget: string }
              - { label: После акцента, name: after, widget: text }
          - label: Блок 9 нейротипов
            name: gallery
            widget: object
            fields:
              - { label: Надпись сверху, name: eyebrow, widget: string }
              - { label: Заголовок, name: title, widget: string }
              - { label: Цветная часть, name: accent_title, widget: string }
              - { label: Вступление, name: intro, widget: text }
              - { label: Заголовок о типах, name: types_title, widget: string }
              - { label: Текст о типах, name: types_text, widget: text }
              - { label: Заголовок об основе, name: foundation_title, widget: string }
              - { label: Текст об основе, name: foundation_text, widget: text }
              - { label: Заголовок об индивидуальности, name: personal_title, widget: string }
              - { label: Текст об индивидуальности, name: personal_text, widget: text }
              - { label: Дополнение об индивидуальности, name: personal_note, widget: text }
              - { label: Ведущая фраза, name: system_lead, widget: text }
              - { label: Подробности, name: system_details, widget: text }
              - { label: Авторская пометка, name: author_note, widget: text }
              - { label: Текст ссылки, name: link_text, widget: string }
              - label: Карточки нейротипов
                name: items
                widget: list
                summary: "{{fields.code}} — {{fields.name}}"
                fields:
                  - { label: Код, name: code, widget: string }
                  - { label: Название, name: name, widget: string }
                  - { label: Мир, name: world, widget: select, options: [S, E, T] }
                  - { label: Режим, name: mode, widget: select, options: [Генеративный, Коммуникативный, Управленческий] }
                  - { label: Профессии, name: profs, widget: text }
                  - { label: Описание, name: desc, widget: text }
                  - { label: Сила, name: strength, widget: text }
                  - { label: Риск, name: risk, widget: text }
          - label: Блок 5 осей
            name: code_map
            widget: object
            fields:
              - { label: Вопрос до акцента, name: question_before, widget: string }
              - { label: Акцент вопроса, name: question_accent, widget: string }
              - { label: Заголовок, name: title, widget: string }
              - { label: Описание, name: description, widget: text }
              - { label: Вывод, name: conclusion, widget: text }
              - { label: Переход, name: transition, widget: text }
              - { label: Финальный вопрос, name: final_question, widget: text }
              - { label: Кнопка, name: button, widget: string }
          - label: Партнёрство на главной
            name: partnership
            widget: object
            fields:
              - { label: Надпись сверху, name: eyebrow, widget: string }
              - { label: Заголовок, name: title, widget: string }
              - { label: Цветная часть, name: accent_title, widget: string }
              - { label: Вопросы аудитории, name: intro, widget: text }
              - { label: Приглашение, name: invitation_before, widget: string }
              - { label: Цветная часть приглашения, name: invitation_accent, widget: string }
              - { label: Описание, name: description, widget: text }
              - { label: Кнопка, name: button, widget: string }
              - { label: Изображение, name: image, widget: image }
              - { label: Описание изображения, name: image_alt, widget: string }
              - { label: Заголовок коллабораций, name: collaborations_title, widget: string }
              - label: Направления партнёрства
                name: partners
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { label: Иконка, name: icon, widget: select, options: [briefcase, graduation-cap, cpu, star, mic] }
                  - { label: Название, name: label, widget: string }
          - label: Оформление FAQ на главной
            name: faq
            widget: object
            fields:
              - { label: Надпись сверху, name: eyebrow, widget: string }
              - { label: Заголовок, name: title, widget: string }
              - { label: Цветная часть, name: accent_title, widget: string }
              - { label: Описание, name: description, widget: text }
              - { label: Кнопка, name: button, widget: string }
          - label: Послание дочитавшим
            name: final_message
            widget: object
            fields:
              - { label: Надпись сверху, name: eyebrow, widget: string }
              - { label: Текст перед временем, name: time_before, widget: string }
              - { label: Текст после времени, name: time_after, widget: string }
              - { label: Введение, name: intro, widget: text }
              - { label: Первый выбор — начало, name: choice_one_before, widget: text }
              - { label: Первый выбор — акцент, name: choice_one_accent, widget: string }
              - { label: Первый выбор — окончание, name: choice_one_after, widget: text }
              - { label: Второй выбор — начало, name: choice_two_before, widget: text }
              - { label: Второй выбор — акцент, name: choice_two_accent, widget: string }
              - { label: Второй выбор — окончание, name: choice_two_after, widget: string }
              - { label: Изображение, name: image, widget: image }
              - { label: Описание изображения, name: image_alt, widget: string }
              - { label: Левая подпись, name: left_caption, widget: string }
              - { label: Правая подпись, name: right_caption, widget: string }
              - { label: Подсказка возврата, name: back_to_top, widget: text }

      - name: author
        label: Главная — об авторе
        file: frontend/src/content/author.json
        format: json
        fields:
          - { label: Надпись сверху, name: eyebrow, widget: string }
          - { label: Заголовок, name: title, widget: string }
          - { label: Цветная часть, name: accent_title, widget: string }
          - { label: Продолжение заголовка, name: title_suffix, widget: string }
          - label: Карточка автора
            name: card
            widget: object
            fields:
              - { label: Описание фото, name: alt, widget: string }
              - { label: Надпись, name: eyebrow, widget: string }
              - { label: Имя, name: name, widget: string }
              - { label: Роль, name: role, widget: string }
              - { label: Подтверждение опыта, name: proof, widget: string }
          - label: История автора
            name: paragraphs
            widget: list
            summary: "{{fields.variant}} — {{fields.text}}"
            fields:
              - { label: Оформление, name: variant, widget: select, options: [normal, lead, quote, proof, transition] }
              - { label: Текст, name: text, widget: text }

      - name: about
        label: Страница «О системе»
        file: frontend/src/content/about.json
        format: json
        fields:
          - label: Первый экран
            name: hero
            widget: object
            fields:
              - { label: Надпись сверху, name: eyebrow, widget: string }
              - { label: Заголовок, name: title, widget: string }
              - { label: Продолжение, name: title_suffix, widget: string }
          - label: Метафора с корзиной
            name: basket
            widget: object
            fields:
              - { label: Надпись сверху, name: eyebrow, widget: string }
              - { label: Заголовок, name: title, widget: string }
              - { label: Цветная часть, name: accent_title, widget: string }
              - { label: Абзацы, name: paragraphs, widget: list }
              - { label: Карточки, name: cards, widget: list }
              - { label: Описание медиа, name: media_alt, widget: string }
          - label: Главная идея
            name: main_idea
            widget: object
            fields:
              - { label: Надпись сверху, name: eyebrow, widget: string }
              - { label: Заголовок, name: title, widget: string }
              - { label: Цветная часть, name: accent_title, widget: string }
              - { label: Абзацы, name: paragraphs, widget: list }
              - { label: Пункты, name: points, widget: list }
              - { label: Вывод, name: conclusion, widget: text }
          - label: Главная формула
            name: main_formula
            widget: object
            fields:
              - { label: Надпись сверху, name: eyebrow, widget: string }
              - { label: Текст, name: text, widget: string }
              - { label: Акцент, name: accent, widget: string }
              - { label: Окончание, name: suffix, widget: string }
          - label: Переход к 5 осям
            name: axes_intro
            widget: object
            fields:
              - { label: Вопрос, name: question, widget: text }
              - { label: Надпись сверху, name: eyebrow, widget: string }
              - { label: Заголовок, name: title, widget: string }
              - { label: Цветная часть, name: accent_title, widget: string }
              - { label: Описание, name: description, widget: text }
          - label: Введение в нейротипы
            name: neurotype_intro
            widget: object
            fields:
              - { label: Надпись сверху, name: eyebrow, widget: string }
              - { label: Заголовок, name: title, widget: string }
              - { label: Цветная часть, name: accent_title, widget: string }
              - { label: Абзацы, name: paragraphs, widget: list }
              - { label: Надпись над формулой, name: formula_eyebrow, widget: string }
              - { label: Формула, name: formula, widget: string }
              - { label: Пояснение формулы, name: formula_text, widget: text }
              - { label: Ссылка на каталог, name: catalog_text, widget: string }
          - label: Матрица 9 нейротипов
            name: matrix
            widget: object
            fields:
              - { label: Заголовок, name: title, widget: string }
              - { label: Подсказка, name: hint, widget: text }
              - { label: Вывод, name: conclusion, widget: text }
              - { label: Окончание вывода, name: conclusion_suffix, widget: text }
              - label: Строки таблицы
                name: rows
                widget: list
                summary: "{{fields.world}}"
                fields:
                  - { label: Мир, name: world, widget: string }
                  - { label: Режим 1, name: mode_1, widget: string }
                  - { label: Режим 2, name: mode_2, widget: string }
                  - { label: Режим 3, name: mode_3, widget: string }
              - label: Подписи 9 нейротипов
                name: neurotypes
                widget: list
                summary: "{{fields.code}} — {{fields.name}}"
                fields:
                  - { label: Код, name: code, widget: string }
                  - { label: Название, name: name, widget: string }
                  - { label: Роль в мире, name: role, widget: text }
          - label: 5 осей GENIQ
            name: axes
            widget: list
            summary: "{{fields.code}} — {{fields.title}}"
            fields:
              - { label: Код, name: code, widget: string }
              - { label: Название, name: title, widget: string }
              - { label: Вопрос, name: question, widget: string }
              - { label: Краткое описание, name: subtitle, widget: text }
              - { label: Иконка, name: icon, widget: select, options: [brain, battery, chevrons-right, flower, eye] }
              - { label: Полное описание, name: text, widget: text }
              - { label: Параметры, name: params, widget: list }
          - label: 3 мира восприятия
            name: worlds
            widget: list
            summary: "{{fields.code}} — {{fields.title}}"
            fields:
              - { label: Код, name: code, widget: select, options: [S, E, T] }
              - { label: Название, name: title, widget: string }
              - { label: Описание, name: text, widget: text }
              - { label: Функция, name: function, widget: text }
              - { label: Нейротипы, name: neurotypes, widget: string }
              - { label: Иконка, name: icon, widget: select, options: [brain, sparkles, layers] }
          - label: 3 режима мышления
            name: modes
            widget: list
            summary: "{{fields.code}} — {{fields.title}}"
            fields:
              - { label: Код, name: code, widget: select, options: ['1', '2', '3'] }
              - { label: Название, name: title, widget: string }
              - { label: Действие, name: action, widget: string }
              - { label: Описание, name: text, widget: text }
              - { label: Функция, name: function, widget: text }
              - { label: Нейротипы, name: neurotypes, widget: string }
          - label: Все 9 нейротипов
            name: multiple
            widget: object
            fields:
              - { label: Заголовок, name: title, widget: string }
              - { label: Цветная часть, name: accent_title, widget: string }
              - { label: Абзацы, name: paragraphs, widget: list }
              - { label: Цитата, name: quote, widget: text }
          - label: Диагностика
            name: diagnostics
            widget: object
            fields:
              - { label: Надпись сверху, name: eyebrow, widget: string }
              - { label: Заголовок, name: title, widget: string }
              - { label: Цветная часть, name: accent_title, widget: string }
              - { label: Абзацы, name: paragraphs, widget: list }
